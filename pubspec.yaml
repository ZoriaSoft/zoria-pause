name: zoriapause
description: "Zoria Pause — Private DNS'i Quick Settings tile'ından duraklat / geri aç (cihaz içi, sunucusuz)."
publish_to: 'none'

version: 0.4.0+2013

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# P2 kuralı: pubspec'te yalnız AKTİM KULLANILAN paket durur; sonraki fazların
# paketleri commented-out bekler (bkz. Skills/zoria-project-bootstrap P2 tuzuğu).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: ^0.20.2

  # Durum logu (Faz 4) — native event log'un Drift senkronu.
  # drift_flutter: resmi bundler (sqlite3_flutter_libs EOL — REVIEW 2026-09-05
  # ertelenmesi 2026-09-06'da kapatıldı); DB yolu/adı değişmedi, path_provider
  # artık dolaylı (P2: doğrudan kullanım kalmadı).
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Sentry (Faz 6): tüm mobil app'ler ortak zoria-apps DSN'i, app tag'i ile
  # ayrılır — desen zoria-task main.dart (bkz. SENTRY-MOBILE.md, zoria-platform).
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: design/icon-1024.png
  min_sdk_android: 24
  adaptive_icon_background: "#F2EDE1"
  adaptive_icon_foreground: design/icon-fg.png
  adaptive_icon_monochrome: design/icon-mono.png

flutter:
  uses-material-design: true
  generate: true

  # Kurulum kilavuzu adim goruntuleri (emulator'dan cekilmis gercek ekranlar).
  assets:
    - assets/guide/

  # 'Anahtar Panosu' tipografisi — DESIGN.md sözleşmesi. Jost (değişken keski,
  # latin-ext ✓ ğşıöçİ) + IBM Plex Mono (hostname/süre/durum bandı). Body =
  # sistem Roboto (product register, DESIGN.md 5 Sütun). Lisanslar OFL, assets
  # altında — offline-first brand (google_fonts çalışma anı fetch'i YASAK).
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
